<script>
"use strict";
const SUPA = "https://dbpbssdrwolssrdaypzw.supabase.co/rest/v1/rpc/";
const ANAHTAR = "sb_publishable_XHbSoSAa11HFP9AAEM3esQ_ziAMPbqX";
const DEPO = "softnest_mobil_v1";
const $ = id => document.getElementById(id);
const kac = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const para = n => Number(n || 0).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
const sayi = n => Number(n || 0).toLocaleString("tr-TR", { maximumFractionDigits: 3 });

// ---------- Durum ----------
let S = { anahtar: "", kullanici: null, cihaz: 0, sira: 0, urunler: [], kategoriler: [], musteriler: [], cari: [], ayar: {}, isletme: "", tabanStok: {}, kuyruk: [], satislarim: [], sayac: {}, dukSira: 0, dukSatis: {}, dukOdeme: {}, dukParca: {}, dukKalem: null, dukZaman: 0 };
try { const k = JSON.parse(localStorage.getItem(DEPO) || "null"); if (k) S = { ...S, ...k }; } catch (e) { /* ilk açılış */ }
// Satış kalemleri sonradan eklendi: eski imleçle kalemler hiç gelmez, bir kez baştan çekilir
if (!S.dukKalem || S.dukKalemSurum !== 2) { S.dukKalem = {}; S.dukSira = 0; S.dukKalemSurum = 2; }
if (!S.cihaz) S.cihaz = 1 + Math.floor(Math.random() * 998);
let sepet = [], seciliKategori = "", aramaMetni = "", cevrimici = navigator.onLine;
function kaydet() { try { localStorage.setItem(DEPO, JSON.stringify(S)); } catch (e) { bildir("Kayıt alanı dolu"); } }

function bildir(m, ms) { const b = $("bildirim"); b.textContent = m; b.hidden = false; clearTimeout(bildir.z); bildir.z = setTimeout(() => b.hidden = true, ms || 2200); }

// ---------- SHA-256 (güvenli bağlam yoksa da çalışır) ----------
function sha256(metin) {
  const bayt = new TextEncoder().encode(metin), K = [], H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  let p = 2, n = 0; const asal = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  while (n < 64) { if (asal(p)) { K[n++] = (Math.cbrt(p) % 1 * 4294967296) | 0; } p++; }
  const l = bayt.length, bl = ((l + 8) >> 6) + 1, w = new Uint32Array(bl * 16);
  for (let i = 0; i < l; i++) w[i >> 2] |= bayt[i] << (24 - (i % 4) * 8);
  w[l >> 2] |= 0x80 << (24 - (l % 4) * 8); w[bl * 16 - 1] = l * 8;
  const sag = (x, c) => (x >>> c) | (x << (32 - c));
  for (let o = 0; o < w.length; o += 16) {
    const m = new Uint32Array(64); for (let i = 0; i < 16; i++) m[i] = w[o + i];
    for (let i = 16; i < 64; i++) { const s0 = sag(m[i - 15], 7) ^ sag(m[i - 15], 18) ^ (m[i - 15] >>> 3), s1 = sag(m[i - 2], 17) ^ sag(m[i - 2], 19) ^ (m[i - 2] >>> 10); m[i] = (m[i - 16] + s0 + m[i - 7] + s1) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (sag(e, 6) ^ sag(e, 11) ^ sag(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + m[i]) | 0, t2 = ((sag(a, 2) ^ sag(a, 13) ^ sag(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

// ---------- Bulut ----------
async function rpc(ad, govde) {
  const y = await fetch(SUPA + ad, { method: "POST", headers: { apikey: ANAHTAR, "Content-Type": "application/json" }, body: JSON.stringify(govde) });
  if (!y.ok) throw new Error("Sunucu yanıt vermedi (" + y.status + ")");
  return y.json();
}
const TELEFON_TABLOLARI = ["urunler", "kategoriler", "musteriler", "cari_hareketler", "ayarlar"];
async function cek() {
  const guncellenen = new Set();
  for (let tur = 0; tur < 30; tur++) {
    const r = await rpc("bulut_al", { p_anahtar: S.anahtar, p_sonra: S.sira, p_cihaz: "tel-" + S.cihaz, p_tablolar: TELEFON_TABLOLARI });
    if (!r.ok) throw new Error(r.hata || "Alınamadı");
    for (const k of r.kayitlar) {
      const id = Number(k.kid);
      if (k.tablo === "ayarlar") { S.isletme = (k.veri && k.veri.isletmeAdi) || ""; $("u-isletme").textContent = S.isletme || "SOFTNEST-satış"; continue; }
      const dizi = k.tablo === "urunler" ? S.urunler : k.tablo === "kategoriler" ? S.kategoriler : k.tablo === "musteriler" ? S.musteriler : k.tablo === "cari_hareketler" ? S.cari : null;
      if (!dizi) continue;
      const i = dizi.findIndex(x => x.id === id);
      if (k.silindi) { if (i >= 0) dizi.splice(i, 1); continue; }
      const kayit = k.tablo === "cari_hareketler" ? { id, musteri_id: k.veri.musteri_id, tur: k.veri.tur, tutar: Number(k.veri.tutar || 0), tarih: k.veri.tarih, aciklama: k.veri.aciklama || "" } : { ...k.veri };
      if (k.tablo === "urunler") { S.tabanStok[id] = Number(k.veri.stok || 0); guncellenen.add(id); }
      if (i >= 0) dizi[i] = kayit; else dizi.push(kayit);
    }
    S.sira = r.sira;
    if (r.kayitlar.length < 1500) break;
  }
  S.urunler.forEach(u => { if (guncellenen.has(u.id)) u.stok = S.tabanStok[u.id] ?? u.stok ?? 0; });
  // Henüz buluta gitmemiş satışların stok düşümü yeniden uygulanır
  S.kuyruk.filter(k => k.tablo === "stok_hareketleri").forEach(k => { const u = S.urunler.find(x => x.id === k.veri.urun_id); if (u && guncellenen.has(u.id)) u.stok = Math.round((u.stok + k.veri.miktar) * 1000) / 1000; });
}
// Dükkânın tüm kasalarındaki satışlar (canlı takip): satislar + odemeler ayrı bir imleçle çekilir, son 14 gün saklanır
async function cekDukkan() {
  const sinir = Date.now() - 14 * 86400000;
  for (let tur = 0; tur < 40; tur++) {
    const r = await rpc("bulut_al", { p_anahtar: S.anahtar, p_sonra: S.dukSira, p_cihaz: "tel-" + S.cihaz, p_tablolar: ["satislar", "odemeler", "satis_kalemleri"] });
    if (!r.ok) throw new Error(r.hata || "Alınamadı");
    for (const k of r.kayitlar) {
      const id = Number(k.kid), v = k.veri || {};
      if (k.tablo === "satislar") {
        if (k.silindi) { delete S.dukSatis[id]; continue; }
        if (new Date(v.tarih).getTime() < sinir) continue;
        S.dukSatis[id] = { id, fis_no: v.fis_no, tarih: v.tarih, toplam: Number(v.toplam || 0), kasa: v.kasa_no || "", durum: v.durum || "tamamlandi", iade: !!(v.iade_fis_id || v.iade), musteri_id: v.musteri_id || null };
      } else if (k.tablo === "odemeler") {
        // Bir satışın birden çok ödemesi olabilir (parçalı): her ödeme kendi numarasıyla tutulur
        S.dukParca = S.dukParca || {};
        const pl = S.dukParca[v.satis_id] = S.dukParca[v.satis_id] || {};
        if (k.silindi) delete pl[id]; else pl[id] = [v.yontem, Number(v.tutar || 0)];
        const yl = [...new Set(Object.values(pl).map(x => x[0]))];
        if (!yl.length) { delete S.dukOdeme[v.satis_id]; delete S.dukParca[v.satis_id]; continue; }
        S.dukOdeme[v.satis_id] = yl.length > 1 ? "parcali" : yl[0];
      } else if (k.tablo === "satis_kalemleri") {
        const l = (S.dukKalem[v.satis_id] || []).filter(x => x.id !== id);
        if (!k.silindi) l.push({ id, urun_id: v.urun_id, ad: v.urun_adi || "", miktar: Number(v.miktar || 0), fiyat: Number(v.birim_fiyat || 0), tutar: Number(v.tutar || 0) });
        S.dukKalem[v.satis_id] = l;
      }
    }
    S.dukSira = r.sira;
    if (r.kayitlar.length < 1500) break;
  }
  for (const id of Object.keys(S.dukOdeme)) if (!S.dukSatis[id]) delete S.dukOdeme[id];
  for (const id of Object.keys(S.dukParca || {})) if (!S.dukSatis[id]) delete S.dukParca[id];
  for (const id of Object.keys(S.dukKalem)) if (!S.dukSatis[id]) delete S.dukKalem[id];
  S.dukZaman = Date.now();
}
async function it() {
  while (S.kuyruk.length) {
    const parca = S.kuyruk.slice(0, 300);
    const r = await rpc("bulut_gonder", { p_anahtar: S.anahtar, p_cihaz: "tel-" + S.cihaz, p_kayitlar: parca.map(k => ({ tablo: k.tablo, kid: k.kid, veri: k.veri, silindi: false, g: k.g })) });
    if (!r.ok) throw new Error(r.hata || "Gönderilemedi");
    S.kuyruk.splice(0, parca.length);
    kaydet();
  }
}
let esitleniyor = false;
async function esitle(sessiz) {
  if (esitleniyor || !S.anahtar || !S.kullanici) return;
  esitleniyor = true;
  try {
    await it(); await cek(); try { await cekDukkan(); } catch (e) { /* canlı takip alınamazsa ana eşitleme bozulmaz */ } kaydet(); cevrimici = true; durumYaz();
    ekranCiz();
  } catch (e) { cevrimici = false; durumYaz(e.message); if (!sessiz) bildir("Eşitlenemedi: " + e.message); }
  esitleniyor = false;
}
function durumYaz(hata) {
  $("u-durum").className = "durum " + (cevrimici ? "acik" : "kapali");
  $("u-durum-yazi").textContent = (cevrimici ? "Çevrimiçi" : "Çevrimdışı") + (S.kuyruk.length ? " · " + S.kuyruk.filter(k => k.tablo === "satislar").length + " satış bekliyor" : "");
}

// ---------- Giriş ----------
async function girisYap() {
  const kadi = $("g-kadi").value.trim(), sifre = $("g-sifre").value;
  $("g-hata").textContent = "";
  if (!kadi || !sifre) return ($("g-hata").textContent = "Tüm alanları doldurun");
  $("g-giris").disabled = true; $("g-giris").textContent = "Giriş yapılıyor...";
  try {
    // Kullanıcı adı + şifre ile giriş: işletme (lisans) bulutta kullanıcıdan bulunur
    const r = await rpc("bulut_giris_kullanici", { p_kadi: kadi, p_sifre_hash: sha256(sifre) });
    const anahtar = r.anahtar;
    if (!r.ok) throw new Error(r.hata || "Giriş yapılamadı");
    if (S.anahtar && S.anahtar.replace(/\D/g, "") !== anahtar.replace(/\D/g, "")) S = { ...S, urunler: [], kategoriler: [], musteriler: [], cari: [], tabanStok: {}, kuyruk: [], satislarim: [], sira: 0 };
    S.anahtar = anahtar; S.kullanici = r.kullanici; kaydet();
    uygulamayiAc();
  } catch (e) { $("g-hata").textContent = e.message; }
  $("g-giris").disabled = false; $("g-giris").textContent = "Giriş yap";
}
function cikis() { S.kullanici = null; sepet = []; kaydet(); kapat(); $("uygulama").hidden = true; $("giris").hidden = false; }
function uygulamayiAc() {
  $("giris").hidden = true; $("uygulama").hidden = false;
  $("u-kim").textContent = S.kullanici.ad_soyad;
  $("u-isletme").textContent = S.isletme || "SOFTNEST-satış";
  sekmeyeGec("ana"); durumYaz(); esitle(false);
}

// ---------- Sekmeler (Ana ekran, Satış, Fiyat gör, Müşteri, Stok) ----------
const SEKMELER = ["ana", "kasa", "fiyat", "urun", "musteri", "stok", "ayar"];
let sekme = "ana", stokSuzgec = "hepsi", fiyatSecili = null;
const trKucuk = s => String(s == null ? "" : s).toLocaleLowerCase("tr");
const yerelGun = iso => { const d = new Date(iso); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const kritikMi = u => Number(u.kritik_stok) > 0 && u.stok > 0 && u.stok <= Number(u.kritik_stok);
const aktifUrunler = () => S.urunler.filter(u => u.aktif && !u.silindi);
function kuyrugaEkle(tablo, veri) { S.kuyruk.push({ tablo, kid: veri.id, veri, g: Date.now() }); return veri; }
function sekmeyeGec(ad) {
  sekme = ad;
  SEKMELER.forEach(s => { $("t-" + s).hidden = s !== ad; });
  document.querySelectorAll("#altmenu button").forEach(b => b.classList.toggle("aktif", b.dataset.s === ad));
  $("sepet-cubuk").hidden = ad !== "kasa";
  $("sekmeler").scrollTop = 0;
  ekranCiz();
}
function ekranCiz() {
  const sp = sepet.reduce((t, s) => t + s.adet, 0), kr = aktifUrunler().filter(kritikMi).length;
  $("rz-sepet").hidden = !sp; $("rz-sepet").textContent = sp;
  $("rz-stok").hidden = !kr; $("rz-stok").textContent = kr;
  if (sekme === "ana") anaCiz(); else if (sekme === "kasa") kasaCiz(); else if (sekme === "fiyat") fiyatCiz(); else if (sekme === "urun") urunCiz(); else if (sekme === "musteri") musteriCiz(); else if (sekme === "stok") stokCiz(); else if (sekme === "ayar") ayarCiz();
}
function donut(parcalar, merkez, alt) {
  const r = 42, c = 2 * Math.PI * r, top = parcalar.reduce((t, p) => t + p.v, 0);
  let ofs = 0;
  const halka = top > 0 ? parcalar.filter(p => p.v > 0).map(p => { const len = c * p.v / top; const s = `<circle cx="55" cy="55" r="${r}" fill="none" stroke="${p.c}" stroke-width="13" stroke-dasharray="${len.toFixed(1)} ${(c - len).toFixed(1)}" stroke-dashoffset="${(-ofs).toFixed(1)}" transform="rotate(-90 55 55)"/>`; ofs += len; return s; }).join("") : "";
  return `<svg viewBox="0 0 110 110" width="112" height="112" aria-hidden="true"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--cizgi)" stroke-width="13"/>${halka}<text x="55" y="53" text-anchor="middle" font-size="19" font-weight="800" fill="currentColor">${merkez}</text><text x="55" y="69" text-anchor="middle" font-size="9.5" fill="var(--soluk)">${alt}</text></svg>`;
}
const IK = {
  satis: '<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2.4l2.2 11h10.4l2-8H6.2"/></svg>',
  fiyat: '<svg viewBox="0 0 24 24"><path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>',
  tara: '<svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M7 12h10"/></svg>',
  musteri: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/></svg>',
  stok: '<svg viewBox="0 0 24 24"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></svg>',
  liste: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>'
};

// ---------- Ayarlar ----------
const AYAR_VARSAYILAN = { tema: "sistem", ses: true, titresim: true, fisIsletme: "", fisAdres: "", fisTel: "", fisNot: "Teşekkür ederiz" };
const AY = () => ({ ...AYAR_VARSAYILAN, ...(S.ayar || {}) });
function ayarYaz(k, v) { S.ayar = { ...(S.ayar || {}), [k]: v }; kaydet(); }
function temaUygula() { const t = AY().tema; if (t === "sistem") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
function ayarCiz() {
  const a = AY();
  $("t-ayar").innerHTML = `

// ---------- Ana ekran ----------
function cariBakiye(id) { return S.cari.reduce((t, h) => h.musteri_id !== id ? t : t + (h.tur === "borc" ? h.tutar : -h.tutar), 0); }
// Tüm kasalar: bugünkü ciro, ödeme dağılımı, dünle karşılaştırma ve son satışlar (bu telefon dahil)
function dukkanKutusu() {
  const hepsi = new Map();
  Object.values(S.dukSatis).forEach(x => hepsi.set(x.fis_no || ("i" + x.id), { ...x, yontem: S.dukOdeme[x.id] || "", parcalar: dukParcalar(x.id) }));
  S.satislarim.forEach(x => { if (!hepsi.has(x.fis_no)) hepsi.set(x.fis_no, { fis_no: x.fis_no, tarih: x.tarih, toplam: x.toplam, kasa: "M" + S.cihaz, durum: "tamamlandi", yontem: x.yontem, parcalar: x.parcalar }); });
  const tum = [...hepsi.values()].filter(x => x.durum === "tamamlandi").sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
  if (!tum.length && !S.dukZaman) return `<div class="kutu"><h3>Dükkân · tüm kasalar</h3><small>Veriler yükleniyor...</small></div>`;
  const bugun = yerelGun(new Date().toISOString()), dun = yerelGun(new Date(Date.now() - 86400000).toISOString());
  const topla = (l, y) => l.reduce((t, x) => t + (!y ? x.toplam : x.parcalar ? x.parcalar.filter(p => p.yontem === y).reduce((a, p) => a + p.tutar, 0) : x.yontem === y ? x.toplam : 0), 0);
  const b = tum.filter(x => yerelGun(x.tarih) === bugun), d = tum.filter(x => yerelGun(x.tarih) === dun);
  const ciro = topla(b), dunCiro = topla(d), fark = dunCiro > 0 ? Math.round((ciro - dunCiro) / dunCiro * 100) : null;
  const kasalar = [...new Set(b.map(x => x.kasa).filter(Boolean))];
  const saat = S.dukZaman ? new Date(S.dukZaman).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }) : "—";
  return `<div class="kutu dukkan"><h3>Dükkân · tüm kasalar <small style="float:right;font-weight:400">Güncelleme ${saat}</small></h3>
    <div class="buyuk">${para(ciro)}</div>
    <div class="satir2" style="margin-top:6px"><div><b>${b.length}</b>satış</div><div><b>${b.length ? para(ciro / b.length) : "—"}</b>ortalama sepet</div><div><b>${fark === null ? "—" : (fark >= 0 ? "+" : "") + fark + "%"}</b>düne göre</div></div>
    <div class="halkalar" style="margin-top:10px">${donut([{ v: topla(b, "nakit"), c: "#1e8e4e" }, { v: topla(b, "kart"), c: "#3b6ab3" }, { v: topla(b, "acik_hesap"), c: "#e0953a" }], b.length, "satış")}
      <div class="lejant"><div><i style="background:#1e8e4e"></i>Nakit<b>${para(topla(b, "nakit"))}</b></div><div><i style="background:#3b6ab3"></i>Kart<b>${para(topla(b, "kart"))}</b></div><div><i style="background:#e0953a"></i>Açık hesap<b>${para(topla(b, "acik_hesap"))}</b></div></div></div>
    <div style="margin-top:10px;font-size:13px;opacity:.75">${kasalar.length ? "Bugün satış yapan kasa: " + kasalar.map(kac).join(", ") : "Bugün henüz satış yok"}</div>
    ${tum.slice(0, 6).map(x => `<div class="liste-satir" data-fis="${kac(x.fis_no)}"><div class="bilgi"><b>${kac(x.fis_no)}</b><small>${new Date(x.tarih).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" })} · ${kac(x.kasa)} · ${YONTEM[x.yontem] || x.yontem || ""}</small></div><b>${para(x.toplam)}</b></div>`).join("")}
  </div>`;
}
function anaCiz() {
  const bugun = yerelGun(new Date().toISOString()), l = S.satislarim.filter(s => yerelGun(s.tarih) === bugun);
  const ciro = l.reduce((t, s) => t + s.toplam, 0), yon = y => l.filter(s => s.yontem === y).reduce((t, s) => t + s.toplam, 0);
  const nakit = yon("nakit"), kart = yon("kart"), acik = yon("acik_hesap");

    <div class="kutu"><h3>Ödeme dağılımı (bugün)</h3><div class="halkalar">
      ${donut([{ v: nakit, c: "#1e8e4e" }, { v: kart, c: "#3b6ab3" }, { v: acik, c: "#e0953a" }], l.length, "satış")}
      <div class="lejant"><div><i style="background:#1e8e4e"></i>Nakit<b>${para(nakit)}</b></div><div><i style="background:#3b6ab3"></i>Kart<b>${para(kart)}</b></div><div><i style="background:#e0953a"></i>Açık hesap<b>${para(acik)}</b></div></div>
    </div></div>
    <div class="mini"><small>Müşterilerden alacağım</small><b>${para(alacak)}</b></div>
    <div class="kutu"><h3>Son satışlar</h3>
      ${S.satislarim.slice(0, 5).map(s => `<div class="liste-satir" data-fis="${kac(s.fis_no)}"><div class="bilgi"><b>${kac(s.fis_no)}</b><small>${new Date(s.tarih).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" })} · ${YONTEM[s.yontem] || s.yontem}</small></div><b>${para(s.toplam)}</b></div>`).join("") || '<div class="bos" style="padding:14px 0">Bu telefondan henüz satış yapılmadı</div>'}
    </div>`;
  $("t-ana").querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
    const h = b.dataset.h;
    if (h === "satislar") return fislerSayfasi();

// ---------- Kamera ile barkod ----------
let kameraAkis = null, kameraDongu = null, sonOkunan = "", sonZaman = 0;
let kameraMod = "kasa";
const BARKOD_BICIMLERI = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf"];
// Safari'de yerleşik BarcodeDetector yok; o zaman uygulamayla gelen zxing okuyucusu (zxing/ klasörü) kullanılır
let barkodCoz = null;
function betikYukle(adres) {
  return new Promise((coz, red) => { const b = document.createElement("script"); b.src = adres; b.onload = coz; b.onerror = () => red(new Error("dosya yüklenemedi: " + adres)); document.head.appendChild(b); });
}
async function barkodOkuyucu() {
  if (barkodCoz) return barkodCoz;
  let yerlesik = false;
  try { yerlesik = "BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("ean_13"); } catch (e) { /* yok */ }
  if (yerlesik) {
    const det = new BarcodeDetector({ formats: BARKOD_BICIMLERI });
    barkodCoz = async kaynak => { const r = await det.detect(kaynak); return r.length ? r[0].rawValue : null; };
    return barkodCoz;
  }
  if (!window.ZXingWASM) await betikYukle("zxing/zxing-reader.js");
  ZXingWASM.setZXingModuleOverrides({ locateFile: (ad, onek) => ad.endsWith(".wasm") ? new URL("zxing/" + ad, location.href).href : onek + ad });
  await ZXingWASM.getZXingModule();
  const secenek = { formats: ["EAN13", "EAN8", "UPCA", "UPCE", "Code128", "Code39", "ITF"], tryHarder: true, maxNumberOfSymbols: 1 };
  barkodCoz = async kaynak => { const r = await ZXingWASM.readBarcodesFromImageData(kaynak, secenek); return r.length ? r[0].text : null; };
  barkodCoz.goruntuIster = true;
  return barkodCoz;
}
// Kameradan o anki karenin yalnızca çerçeve (ipucu kutusu) bölgesini tam çözünürlükte alır;
// küçültmek çizgileri inceltip okumayı bozuyor, kırpmak hem hızlı hem net
const kareTuval = document.createElement("canvas");
function kareAl(v) {
  const g = v.videoWidth, y = v.videoHeight; if (!g || !y) return null;
  // video ekranı "cover" ile dolduruyor: ekran koordinatı -> video pikseli
  const vr = v.getBoundingClientRect(), cr = document.querySelector("#kamera .ipucu").getBoundingClientRect();
  const o = Math.max(vr.width / g, vr.height / y);
  const ox = (vr.width - g * o) / 2, oy = (vr.height - y * o) / 2;
  const pay = 40; // çerçevenin biraz dışını da al
  let x0 = (cr.left - vr.left - ox - pay) / o, y0 = (cr.top - vr.top - oy - pay) / o;
  let x1 = (cr.right - vr.left - ox + pay) / o, y1 = (cr.bottom - vr.top - oy + pay) / o;
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0)); x1 = Math.min(g, Math.ceil(x1)); y1 = Math.min(y, Math.ceil(y1));
  if (!(x1 - x0 > 50 && y1 - y0 > 50)) { x0 = 0; y0 = 0; x1 = g; y1 = y; }
  kareTuval.width = x1 - x0; kareTuval.height = y1 - y0;
  const c = kareTuval.getContext("2d", { willReadFrequently: true });
  c.drawImage(v, x0, y0, x1 - x0, y1 - y0, 0, 0, x1 - x0, y1 - y0);
  return c.getImageData(0, 0, x1 - x0, y1 - y0);
}
function kameraDurum(yazi) { $("kamera-durum").textContent = yazi || ""; }
async function kameraAc(mod) {
  kameraMod = ["fiyat", "urun", "form"].includes(mod) ? mod : "kasa";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return bildir("Kamera bu tarayıcıda kullanılamıyor. Uygulamayı https adresinden açın.", 3500);
  // Önce kamera izni istenir (Safari izin kutusunu burada gösterir)
  try {
    kameraAkis = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) { return bildir("Kamera izni verilmedi. iPhone'da Ayarlar > Safari > Kamera bölümünden 'İzin Ver' seçin.", 4500); }
  const v = $("video"); v.srcObject = kameraAkis; await v.play(); $("kamera").hidden = false;
  kameraDurum("Okuyucu hazırlanıyor…");
  let coz;
  try { coz = await barkodOkuyucu(); }
  catch (e) { kameraKapat(); return bildir("Barkod okuyucu yüklenemedi: " + (e && e.message || e), 5000); }
  kameraDurum("Barkodu çerçeveye tutun");
  let mesgul = false, hataSay = 0; // önceki kare çözülmeden yenisi başlamaz
  kameraDongu = setInterval(async () => {
    if (mesgul || !kameraAkis) return;
    mesgul = true;
    try {
      const kaynak = coz.goruntuIster ? kareAl(v) : v; if (!kaynak) return;
      const kod = await coz(kaynak); hataSay = 0; if (!kod) return;
      const simdi = Date.now();
      if (kod === sonOkunan && simdi - sonZaman < 1800) return;
      sonOkunan = kod; sonZaman = simdi;
      if (navigator.vibrate) navigator.vibrate(60);
      if (kameraMod === "form") { kameraKapat(); if ($("uf-barkod")) { $("uf-barkod").value = kod; $("uf-ad").focus(); } return; }
      if (kameraMod === "urun") { kameraKapat(); urunBarkodBul(kod); return; }
      if (kameraMod === "fiyat") { kameraKapat(); $("fy-ara").value = kod; fiyatSecili = null; fiyatAra(); return; }
      if (!barkodIsle(kod)) bildir("Barkod kayıtlı değil: " + kod, 2500); else bildir("Eklendi", 900);
    } catch (e) {
      // Tek kare okunamayabilir; üst üste hata gelirse sebebi ekranda yazılır
      if (++hataSay >= 5) kameraDurum("Okuma hatası: " + (e && e.message || e));
    } finally { mesgul = false; }
  }, 200);
}
function kameraKapat() { clearInterval(kameraDongu); if (kameraAkis) kameraAkis.getTracks().forEach(t => t.stop()); kameraAkis = null; $("kamera").hidden = true; kameraDurum(""); }

// ---------- Sürüm denetimi: yeni sürüm yayınlanınca "güncellensin mi?" diye sorar (adres hep aynı kalır) ----------
const SURUM = "20261029133951";
let guncellemeSoruldu = false;
async function surumDenetle(zorla) {
  if (SURUM === "__SURUM__" || !/^https?:/.test(location.protocol) || (guncellemeSoruldu && !zorla)) return;
  try {
    const y = await fetch("surum.json?t=" + Date.now(), { cache: "no-store" }); if (!y.ok) return;
    const s = await y.json();
    if (s && s.surum && s.surum !== SURUM) { guncellemeSoruldu = true; $("guncelleme").hidden = false; $("gn-evet").onclick = () => { location.replace(location.pathname + "?s=" + encodeURIComponent(s.surum)); }; $("gn-sonra").onclick = () => { $("guncelleme").hidden = true; setTimeout(() => { guncellemeSoruldu = false; }, 30 * 60 * 1000); }; }
  } catch (e) { /* çevrimdışı: sonra denenir */ }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) surumDenetle(); });
setInterval(surumDenetle, 10 * 60 * 1000); setTimeout(surumDenetle, 3000);

temaUygula();
if (S.kullanici && S.anahtar) uygulamayiAc(); else { $("giris").hidden = false; }
