# Konum: .github/dependabot.yml
# GitHub'ın paket açıklarını izlemesini ve güvenlik güncellemelerini önermesini sağlar.
# Projende olmayan ekosistemleri silebilirsin.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
